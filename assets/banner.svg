<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f1a"/>
      <stop offset="100%" stop-color="#161b2c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- soft grid -->
  <g stroke="#1f2742" stroke-width="1" opacity="0.6">
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
  </g>

  <!-- glow accent -->
  <circle cx="1050" cy="160" r="180" fill="url(#accent)" opacity="0.18" filter="url(#glow)"/>

  <!-- wordmark -->
  <g font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace">
    <text x="100" y="260" font-size="148" font-weight="700" fill="#ffffff" letter-spacing="-4">
      Mneme
    </text>
    <text x="100" y="310" font-size="26" fill="url(#accent)" letter-spacing="2" font-weight="500">
      LOCAL-FIRST · LONG-TERM MEMORY · ANY LLM
    </text>
    <text x="100" y="370" font-size="28" fill="#c9d1e2" letter-spacing="0">
      Your assistant remembers you across sessions, not just turns.
    </text>
  </g>

  <!-- four memory tiers -->
  <g font-family="ui-monospace, monospace" font-size="20" fill="#9aa6c1">
    <g transform="translate(100, 460)">
      <rect x="0" y="0" width="240" height="100" rx="14" fill="#10172a" stroke="#2a3554" stroke-width="1"/>
      <text x="20" y="36" fill="#22d3ee" font-weight="600">working</text>
      <text x="20" y="70">current dialog</text>
    </g>
    <g transform="translate(360, 460)">
      <rect x="0" y="0" width="240" height="100" rx="14" fill="#10172a" stroke="#2a3554" stroke-width="1"/>
      <text x="20" y="36" fill="#7c5cff" font-weight="600">episodic</text>
      <text x="20" y="70">events with time</text>
    </g>
    <g transform="translate(620, 460)">
      <rect x="0" y="0" width="240" height="100" rx="14" fill="#10172a" stroke="#2a3554" stroke-width="1"/>
      <text x="20" y="36" fill="#22d3ee" font-weight="600">semantic</text>
      <text x="20" y="70">durable facts</text>
    </g>
    <g transform="translate(880, 460)">
      <rect x="0" y="0" width="240" height="100" rx="14" fill="#10172a" stroke="#2a3554" stroke-width="1"/>
      <text x="20" y="36" fill="#7c5cff" font-weight="600">procedural</text>
      <text x="20" y="70">skills and how-to</text>
    </g>
  </g>

  <!-- corner mark -->
  <g font-family="ui-monospace, monospace" font-size="14" fill="#4b5573">
    <text x="100" y="80">github.com/vladimir120307-droid/mneme</text>
    <text x="1180" y="80" text-anchor="end">MIT</text>
  </g>
</svg>
